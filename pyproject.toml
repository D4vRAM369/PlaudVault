[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plaudvault"
version = "0.3.0rc1"
description = "Bóveda local cifrada para grabaciones de voz: importa audio, transcripciones, notas e infografías de Plaud"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "watchdog>=4.0.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
gui = ["fastapi>=0.110", "uvicorn>=0.29", "markdown-it-py>=3.0"]
test = ["httpx>=0.27"]

[project.scripts]
plaudvault = "plaudvault.__main__:main"

[tool.setuptools]
packages = ["plaudvault"]

[tool.setuptools.package-data]
plaudvault = ["gui_static/*"]   # HTML/JS/CSS no son .py: sin esto no se instalan
