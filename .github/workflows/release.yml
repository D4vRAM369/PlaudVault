name: Linux release

on:
  pull_request:
    paths:
      - 'packaging/**'
      - 'plaudvault/**'
      - 'desktop/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'config.example.yaml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Read version and validate release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          version = json.loads(pathlib.Path('desktop/src-tauri/tauri.conf.json').read_text())['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+(-rc\.\d+)?', version):
              raise SystemExit('Only X.Y.Z or X.Y.Z-rc.N versions are supported')
          if os.environ['EVENT_NAME'] == 'push' and os.environ['REF_NAME'] != f'v{version}':
              raise SystemExit('Tag must match the configured version exactly')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libgtk-3-dev bubblewrap gstreamer1.0-plugins-good gstreamer1.0-libav ffmpeg strace xvfb
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Install Python build dependencies
        run: |
          python -m pip install -e '.[gui,test]'
          python -m pip install -r packaging/requirements-build.txt
      - name: Test Python
        run: |
          for test in tests/test_*.py; do
            python "$test"
          done
      - name: Check and build frontend
        working-directory: desktop
        run: |
          npm ci
          npm run check
          npm run build
      - name: Check, test and build native window
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo test --locked
          cargo build --release --locked
      - name: Build Linux packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python packaging/build_linux.py --native desktop/src-tauri/target/release/plaudvault-desktop --version "$VERSION"
      - name: Test extracted installer
        run: |
          shopt -s nullglob
          packages=(dist/release/*.deb)
          test "${#packages[@]}" -eq 1
          python packaging/smoke_package.py --deb "${packages[0]}"
          cd dist/release
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: linux-x86_64-release
          path: |
            dist/release/*.deb
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: linux-x86_64-release
          path: dist/release
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$RELEASE_TAG" = "v$VERSION"
          (cd dist/release && sha256sum --check SHA256SUMS)
          # Candidatas como prerelease; una versión estable pasa a ser «Latest».
          case "$VERSION" in
            *-rc.*) kind=(--prerelease) ;;
            *) kind=(--latest) ;;
          esac
          gh release create "$RELEASE_TAG" dist/release/*.deb dist/release/*.tar.gz dist/release/SHA256SUMS --verify-tag "${kind[@]}" --title "PlaudVault $VERSION · Linux" --notes-file packaging/RELEASE_NOTES.md
